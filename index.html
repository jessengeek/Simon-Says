<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Simon Says</h1>
        <div class="info-section">
            <div class="info-box">
                <p>Level: <span id="level">0</span></p>
                <p>Score: <span id="score">0</span></p>
            </div>
            <button id="startBtn" class="start-btn">Start Game</button>
        </div>
        <div class="game-board">
            <button class="color-btn" id="green" data-color="green"></button>
            <button class="color-btn" id="red" data-color="red"></button>
            <button class="color-btn" id="yellow" data-color="yellow"></button>
            <button class="color-btn" id="blue" data-color="blue"></button>
        </div>
        <div class="message-section">
            <p id="message">Click "Start Game" to begin!</p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
